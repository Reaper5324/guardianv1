name: Build Guardian Windows package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "guardian/**"
      - "install.ps1"
      - "README.md"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: guardian/go.mod

      - name: Prepare package directory
        working-directory: guardian
        run: New-Item -ItemType Directory -Force dist | Out-Null
        shell: pwsh

      - name: Test and build Windows executable
        working-directory: guardian
        run: |
          go mod download
          go test ./...
          go build -trimpath -ldflags="-s -w" -o dist/guardian.exe ./cmd/guardian
        shell: pwsh

      - name: Assemble installable package
        working-directory: guardian
        run: |
          Copy-Item config.example.json dist/config.json
          $configPath = Join-Path (Get-Location) 'dist/config.json'
          $config = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
          $config.listen_addr = '127.0.0.1:53'
          $json = ConvertTo-Json -InputObject $config -Depth 10
          [System.IO.File]::WriteAllText($configPath, $json, [System.Text.UTF8Encoding]::new($false))
          New-Item -ItemType Directory -Force dist\guardian | Out-Null
          Copy-Item ..\install.ps1 dist\install.ps1
          Copy-Item ..\README.md dist\README.md
          Copy-Item DESIGN.md dist\guardian\DESIGN.md
          Copy-Item config.example.json dist\guardian\config.example.json
          Compress-Archive -Path dist\guardian.exe,dist\config.json,dist\install.ps1,dist\README.md,dist\guardian -DestinationPath Guardian-Windows-x64.zip -Force
        shell: pwsh

      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: Guardian-Windows-x64
          path: guardian/Guardian-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
